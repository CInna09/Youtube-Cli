name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        run: |
          if [ "$(uname -s)" != "Linux" ]; then
            echo "Skipping (not Linux)"
            exit 0
          fi
          echo "=== APT update ==="
          sudo apt-get update -y 2>&1 | tail -3
          echo "=== Install ALSA ==="
          sudo apt-get install -y libasound2-dev pkg-config 2>&1 | tail -10
          echo "=== Check pkg-config ==="
          pkg-config --libs --cflags alsa && echo "✅ ALSA OK" || echo "❌ ALSA not found"
          echo "=== Find alsa.pc ==="
          find /usr -name "alsa.pc" 2>/dev/null || echo "alsa.pc not found"
          echo "=== PKG_CONFIG_PATH ==="
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          BIN="rustyoutube-cli${{ matrix.ext }}"
          ARCHIVE="rustyoutube-cli-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/$BIN" .
          tar czf "$ARCHIVE" "$BIN"
          echo "archive=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive }}
          path: ${{ env.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
